name: NewsWise CI

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'feature/**'
      - 'implementation/**'

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

jobs:
  test-and-lint:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" > local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run all unit tests
        run: ./gradlew test --stacktrace --no-daemon --continue

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: '**/build/reports/tests/'
          retention-days: 30

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: '**/build/reports/lint-results*.html'
          retention-days: 30
          if-no-files-found: warn

  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [ test-and-lint ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      - name: Create local.properties
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}"           > local.properties
          echo "KEYSTORE_FILE=app/release-keystore.jks"            >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                 >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"           >> local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Get branch name
        id: branch_name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Sanitized branch: $SAFE_BRANCH"

      - name: Upload release APK (main — 90-day retention)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NewsWise-release-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload release APK (feature/fix branches — 30-day retention)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NewsWise-${{ steps.branch_name.outputs.branch }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Display APK info
        run: |
          echo "=== APK Information ==="
          ls -lh app/build/outputs/apk/release/
          echo "APK Size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"