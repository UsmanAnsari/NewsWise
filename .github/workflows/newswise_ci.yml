name: NewsWise CI

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'feature/**'
      - 'implementation/**'

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

  # Uncomment when release signing is configured
  # KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  # KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
  # KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" > local.properties

      # Add keystore entries below for signed release builds

      # echo "KEYSTORE_FILE=app/release-keystore.jks"         >> local.properties
      # echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
      # echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"             >> local.properties
      # echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"       >> local.properties

      # Decode keystore
      # Uncomment when release signing is configured.
      # Store the .jks as a base64 secret: base64 -i release-keystore.jks | pbcopy
      # - name: Decode keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      # Gradle cache
      # Key includes *.toml because libs.versions.toml changes affect ALL
      # modules in a multi-module project — a version bump must bust the cache.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Unit tests
      # Runs test task across all 13 modules simultaneously.
      # --continue ensures all modules run even if one fails — full picture.

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon --continue

      # Runs lintDebug on all modules. Catches Compose API misuse, deprecated
      # calls, and accessibility issues (missing contentDescriptions) that
      # unit tests don't cover.

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      # Debug build. Switch to assembleRelease in Phase 8
      # once signing config is set up.

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Replace the debug build above with this
      # - name: Build release APK
      #   run: ./gradlew assembleRelease --stacktrace --no-daemon

      # Branch name for artifact naming
      # Sanitises branch names so "/" → "-" and invalid chars are stripped.
      # feature/headlines-screen → feature-headlines-screen
      - name: Get branch name
        id: branch_name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Sanitized branch: $SAFE_BRANCH"

      # Upload APK — main branch (90-day retention)
      - name: Upload APK (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NewsWise-debug-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # Upload APK — feature / fix branches (30-day retention)
      - name: Upload APK (feature/fix branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NewsWise-${{ steps.branch_name.outputs.branch }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # APK info
      - name: Display APK info
        run: |
          echo "=== APK Information ==="
          ls -lh app/build/outputs/apk/debug/
          echo "APK Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      # Upload test reports (all modules)
      # **/ wildcard captures reports from all 13 modules, not just :app.
      # MovieWise used app/build/reports/ — wrong for multi-module.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: '**/build/reports/tests/'
          retention-days: 30

      # Upload lint reports (all modules)
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: '**/build/reports/lint-results*.html'
          retention-days: 30
          if-no-files-found: warn